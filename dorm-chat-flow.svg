<svg xmlns="http://www.w3.org/2000/svg" width="880" height="122" viewBox="0 0 880 122" role="img"><title>Dorm Chat flow: a resident asks a question, the chatbot finds related notices, and returns an answer with sources</title><rect width="880" height="122" rx="15" fill="#111a2e"/><rect x=".5" y=".5" width="879" height="121" rx="15" fill="none" stroke="#384766"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif"><rect x="20" y="17" width="243" height="88" rx="10" fill="#1a2942"/><text x="35" y="43" font-family="monospace" font-size="12" fill="#a8befa" font-weight="700">01</text><text x="35" y="66" font-size="19" fill="#f3f6ff" font-weight="700">Ask a question</text><text x="35" y="88" font-size="14" fill="#c3cee5">Resident’s question</text><rect x="318" y="17" width="243" height="88" rx="10" fill="#1a2942"/><text x="333" y="43" font-family="monospace" font-size="12" fill="#c7baff" font-weight="700">02</text><text x="333" y="66" font-size="19" fill="#f3f6ff" font-weight="700">Find relevant notices</text><text x="333" y="88" font-size="14" fill="#c3cee5">Retrieval from dorm notices</text><rect x="617" y="17" width="243" height="88" rx="10" fill="#1a2942"/><text x="632" y="43" font-family="monospace" font-size="12" fill="#89e3cc" font-weight="700">03</text><text x="632" y="66" font-size="19" fill="#f3f6ff" font-weight="700">Answer with sources</text><text x="632" y="88" font-size="14" fill="#c3cee5">Reply includes its references</text><g stroke="#7a91bd" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M274 60h30m-7-6 7 6-7 6M573 60h30m-7-6 7 6-7 6"/></g></g></svg>